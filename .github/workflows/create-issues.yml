name: Create Documentation Issues

on:
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Issue title"
        required: true
        type: string

      issue_documentation:
        description: "Issue documentation"
        required: true
        type: string

      repetitions:
        description: "Number of issues"
        required: true
        default: "1"
        type: string

      sprint:
        description: "Sprint"
        required: true
        type: choice
        options:
          - Sprint 1

      micro_sprint:
        description: "Micro Sprint"
        required: false
        type: choice
        default: "None"
        options:
          - None
          - Micro Sprint 1
          - Micro Sprint 2
          - Micro Sprint 3

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest

    env:
      PROJECT_OWNER: ISIS3510-Team12
      PROJECT_NUMBER: "4"
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Get project data
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          SPRINT: ${{ inputs.sprint }}
          MICRO_SPRINT: ${{ inputs.micro_sprint }}
        run: |
          DATA=$(gh api graphql -f query='
            query {
              organization(login: "ISIS3510-Team12") {
                projectV2(number: 4) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2IterationField {
                        id
                        name
                        configuration {
                          iterations {
                            id
                            title
                          }
                          completedIterations {
                            id
                            title
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ')

          PROJECT_ID=$(echo "$DATA" | jq -r '.data.organization.projectV2.id')

          SPRINT_FIELD_ID=$(echo "$DATA" | jq -r '
            .data.organization.projectV2.fields.nodes[]
            | select(.name == "Sprint")
            | .id
          ')

          SPRINT_ITERATION_ID=$(echo "$DATA" | jq -r \
            --arg sprint "$SPRINT" '
              .data.organization.projectV2.fields.nodes[]
              | select(.name == "Sprint")
              | (.configuration.iterations + .configuration.completedIterations)[]
              | select(.title == $sprint)
              | .id
            ')

          MICRO_FIELD_ID=$(echo "$DATA" | jq -r '
            .data.organization.projectV2.fields.nodes[]
            | select(.name == "Micro Sprint")
            | .id
          ')

          if [ "$MICRO_SPRINT" != "None" ]; then
            MICRO_ITERATION_ID=$(echo "$DATA" | jq -r \
              --arg micro "$MICRO_SPRINT" '
                .data.organization.projectV2.fields.nodes[]
                | select(.name == "Micro Sprint")
                | (.configuration.iterations + .configuration.completedIterations)[]
                | select(.title == $micro)
                | .id
              ')
          else
            MICRO_ITERATION_ID=""
          fi

          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "SPRINT_FIELD_ID=$SPRINT_FIELD_ID" >> "$GITHUB_ENV"
          echo "SPRINT_ITERATION_ID=$SPRINT_ITERATION_ID" >> "$GITHUB_ENV"
          echo "MICRO_FIELD_ID=$MICRO_FIELD_ID" >> "$GITHUB_ENV"
          echo "MICRO_ITERATION_ID=$MICRO_ITERATION_ID" >> "$GITHUB_ENV"

      - name: Create issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_DOCUMENTATION: ${{ inputs.issue_documentation }}
          REPETITIONS: ${{ inputs.repetitions }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          for i in $(seq 1 "$REPETITIONS"); do

            if [ "$REPETITIONS" -gt 1 ]; then
              TITLE="$ISSUE_TITLE #$i"
            else
              TITLE="$ISSUE_TITLE"
            fi

            BODY="$ISSUE_DOCUMENTATION

          ---

          Created through GitHub Actions by @$TRIGGERED_BY"

            ISSUE=$(gh api \
              --method POST \
              "repos/$REPOSITORY/issues" \
              -f title="$TITLE" \
              -f body="$BODY")

            echo "$ISSUE" | jq -r '.node_id' >> issues.txt
          done

      - name: Add issues to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          while read -r ISSUE_ID; do

            ITEM=$(gh api graphql \
              -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(
                    input: {
                      projectId: $project
                      contentId: $content
                    }
                  ) {
                    item {
                      id
                    }
                  }
                }
              ' \
              -F project="$PROJECT_ID" \
              -F content="$ISSUE_ID")

            ITEM_ID=$(echo "$ITEM" | jq -r \
              '.data.addProjectV2ItemById.item.id')

            # Sprint
            gh api graphql \
              -f query='
                mutation(
                  $project: ID!,
                  $item: ID!,
                  $field: ID!,
                  $iteration: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $project
                      itemId: $item
                      fieldId: $field
                      value: {
                        iterationId: $iteration
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' \
              -F project="$PROJECT_ID" \
              -F item="$ITEM_ID" \
              -F field="$SPRINT_FIELD_ID" \
              -F iteration="$SPRINT_ITERATION_ID"

            if [ -n "$MICRO_ITERATION_ID" ]; then
              gh api graphql \
                -f query='
                  mutation(
                    $project: ID!,
                    $item: ID!,
                    $field: ID!,
                    $iteration: String!
                  ) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $project
                        itemId: $item
                        fieldId: $field
                        value: {
                          iterationId: $iteration
                        }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                ' \
                -F project="$PROJECT_ID" \
                -F item="$ITEM_ID" \
                -F field="$MICRO_FIELD_ID" \
                -F iteration="$MICRO_ITERATION_ID"
            fi

          done < issues.txt