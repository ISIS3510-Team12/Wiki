name: Create Team Issue

on:
  workflow_dispatch:
    inputs:
      issue_prefix:
        description: "Issue title prefix"
        required: true
        type: choice
        options:
          - MS1
          - MS2
          - MS3
          - MS4
          - Sprint1
          - Sprint2
          - Sprint3
          - Sprint4

      issue_title:
        description: "Issue title"
        required: true
        type: string

      issue_documentation:
        description: "Issue documentation"
        required: true
        type: string

      sprint:
        description: "Sprint"
        required: true
        type: choice
        options:
          - Sprint 1
          - Sprint 2
          - Sprint 3
          - Sprint 4

      micro_sprint:
        description: "Micro Sprint"
        required: true
        default: "None"
        type: choice
        options:
          - None
          - Micro Sprint 1
          - Micro Sprint 2
          - Micro Sprint 3
          - Micro Sprint 4

permissions:
  contents: read
  issues: write

jobs:
  create-team-issue:
    name: Create Team Issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create team issue and add to project
        env:
          REPOSITORY: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "4"
          ISSUE_PREFIX: ${{ inputs.issue_prefix }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_DOCUMENTATION: ${{ inputs.issue_documentation }}
          REPETITIONS: "1"
          SPRINT: ${{ inputs.sprint }}
          MICRO_SPRINT: ${{ inputs.micro_sprint }}
          ASSIGN_TEAM: "true"
          TRIGGERED_BY: ${{ github.actor }}
          ISSUE_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

        run: |
          chmod +x .github/scripts/create-documentation-issues.sh
          .github/scripts/create-documentation-issues.sh